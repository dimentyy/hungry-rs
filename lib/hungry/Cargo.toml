[package]
name = "hungry"
edition = "2024"

[features]
obfuscated-transport = ["dep:ctr"]

[dependencies]
hungry-tl = { path = "../hungry-tl" }

unbite = { path = "../unbite", features = ["debug"] }

aes = "0.9.0-rc.2"
cipher = "0.5.0-rc.3"
crc32fast = "1.5.0"
crypto-bigint = { version = "0.7.0-rc.15", default-features = false }
digest = "0.11.0-rc.5"
sha1 = "0.11.0-rc.3"
sha2 = "0.11.0-rc.3"
num-prime = { version = "0.4.4", default-features = false }

ctr = { version = "0.10.0-rc.2", optional = true }

tokio = { version = "1.49.0", features = ["net", "sync"] }
getrandom = "0.4.0-rc.0"
